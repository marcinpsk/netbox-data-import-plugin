<div class="card" data-branch-refusal>
  <h2 class="card-header">
    <i class="mdi mdi-source-branch me-1"></i>
    Branch not supported
  </h2>
  <div class="card-body">{{ message }}</div>
  <div class="card-footer text-end">
    <a href="{{ request.path }}?_branch=" class="btn btn-primary">Switch to main</a>
  </div>
</div>
