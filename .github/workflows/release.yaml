name: Release

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  # The build command runs only during a release, so a broken one is found on main with the
  # release already half done. Run it here against the version bump the release would write.
  build-command:
    name: Release build command
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install dependencies
        run: uv sync --group dev

      # semantic-release releases from `main` only, so give the pull request that name here.
      # `--patch` forces a version bump, so the build command runs whatever the commits say.
      - name: Run the release build without publishing
        run: |
          git checkout -B main
          uv run semantic-release version --patch --no-commit --no-tag --no-push --no-vcs-release

  semantic-release:
    name: Semantic Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # actions/checkout uses --no-tags internally, which can prevent
      # annotated tag objects from being fetched even with fetch-tags.
      # Re-fetch explicitly so gitpython (used by semantic-release) can
      # dereference annotated tags to their target commits.
      # See: https://github.com/actions/checkout/issues/2309
      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: uv run semantic-release version --changelog --push --vcs-release
