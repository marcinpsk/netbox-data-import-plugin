name: Update coverage report

on:
  # zizmor: ignore[dangerous-triggers] the job below accepts a run only from a push on this
  # repository's main branch, which already needs write access.
  workflow_run:
    workflows: ["Test with supported NetBox and Python versions"]
    types: [completed]
    branches: [main]

jobs:
  # `branches: [main]` matches the head branch of the run, and a fork branch can be called
  # `main` too. Without the checks below, a pull request from such a fork would publish its
  # own coverage artifact to gh-pages through this job.
  publish-coverage:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: coverage-report

      - name: Generate badge JSON
        run: |
          TOTAL=$(python3 -c "import json; print(json.load(open('coverage-report/coverage.json'))['totals']['percent_covered_display'])")
          INT=${TOTAL%.*}
          if [ "$INT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$INT" -ge 80 ]; then COLOR="green"
          elif [ "$INT" -ge 70 ]; then COLOR="yellow"
          else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${TOTAL}%\",\"color\":\"${COLOR}\"}" > coverage-report/badge.json
          echo "Coverage: ${TOTAL}% (${COLOR})"

      - name: Checkout gh-pages
        # zizmor: ignore[artipacked] this job pushes the badge to gh-pages, so this
        # checkout has to keep its credential.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update coverage on gh-pages
        working-directory: gh-pages
        run: |
          rm -rf coverage
          cp -r ../coverage-report/htmlcov coverage
          cp ../coverage-report/badge.json coverage/badge.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage/
          git diff --cached --quiet || git commit -m "Update coverage report [skip ci]"
          git push
