name: Weekly test against NetBox main

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-netbox-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: netbox-data-import-plugin
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Checkout NetBox main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: "netbox-community/netbox"
          path: netbox
          persist-credentials: false
          ref: main

      - name: Install NetBox and plugin
        working-directory: netbox-data-import-plugin
        run: |
          uv pip install --system -r ../netbox/requirements.txt
          uv pip install --system pytest pytest-cov pytest-django 'pytest-xdist>=3.8,<4' tblib
          uv pip install --system -e .

      - name: Set up NetBox configuration
        working-directory: netbox
        run: |
          cat > netbox/netbox/configuration.py << 'EOF'
          import os

          ALLOWED_HOSTS = ['*']
          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'netbox',
              'HOST': 'localhost',
              'PORT': '5432',
              'CONN_MAX_AGE': 300,
              'ENGINE': 'django.db.backends.postgresql'
          }
          REDIS = {
              'tasks': {
                  'HOST': os.environ.get('REDIS_HOST', 'localhost'),
                  'PORT': 6379,
                  'DATABASE': int(os.environ.get('REDIS_DATABASE', '0')),
              },
              'caching': {
                  'HOST': os.environ.get('REDIS_CACHE_HOST', 'localhost'),
                  'PORT': 6379,
                  'DATABASE': int(os.environ.get('REDIS_CACHE_DATABASE', '1')),
              },
          }
          SECRET_KEY = 'test-secret-key-not-for-production-1234567890123456'  # checkov:skip=CKV_SECRET_6: CI-only test fixture
          API_TOKEN_PEPPERS = {0: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}  # checkov:skip=CKV_SECRET_6: CI-only test fixture
          PLUGINS = ['netbox_data_import']
          EOF

      - name: Run tests
        working-directory: netbox-data-import-plugin
        env:
          NETBOX_CONFIGURATION: netbox.configuration
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox
          TEST_DB_NAME: test_netbox_data_import_main_ci
          TEST_REDIS_HOST: localhost
        # Keep the compatibility job consistent with the supported-version job.
        run: pytest --dist loadscope --no-cov --disable-warnings -o pythonpath=../netbox/netbox
