name: Lint and Format

on:
  push:
  pull_request:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run Ruff linting
        run: uv run --locked ruff check .

      - name: Run Ruff formatting check
        run: uv run --locked ruff format --check .

      # Every NetBox module is named in the mypy overrides, so this job needs no NetBox checkout.
      - name: Run mypy
        run: uv run --locked mypy

      # Runs the pinned hook from .pre-commit-config.yaml, so the version lives in one place.
      - name: Audit the workflows
        run: uv run --locked pre-commit run --all-files zizmor
