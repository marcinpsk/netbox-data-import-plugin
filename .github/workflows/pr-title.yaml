name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit subject, and semantic-release
      # skips the release when that subject does not parse as a Conventional Commit.
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with allowed_tags in pyproject.toml ([tool.semantic_release.commit_parser_options]).
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
