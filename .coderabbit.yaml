# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# This file replaces the organization UI settings rather than merging with them, so every
# setting that matters has to be stated here.
reviews:
  profile: assertive
  poem: true

  auto_review:
    # Review a pull request whatever it targets. A stack targets working branches, and only
    # the default branch is reviewed without this.
    base_branches:
      - ".*"

  # Generated files carry no review value, and reviews are rate limited.
  path_filters:
    - "!CHANGELOG.md"
    - "!uv.lock"
    - "!package-lock.json"
    - "!netbox_data_import/tests/query_counts.json"
    - "!netbox_data_import/tests/fixtures/**"
    - "!**/*.license"

  # AGENTS.md is picked up on its own. These add the rules that are easy to miss in a diff.
  path_instructions:
    - path: "netbox_data_import/tests/**/*.py"
      instructions: >-
        Tests must exercise real objects: the real database, the ORM, forms, and serializers.
        Report new Mock, MagicMock, or patch use unless it stands in for an external boundary
        the suite cannot run locally. Report a bug fix that adds no test.
    - path: "**/*.py"
      instructions: >-
        Every file needs an SPDX header. docs/agents/licensing.md is the only authority on its
        format: a new file uses SPDX-FileCopyrightText with the year it was added, and an
        existing Copyright (C) header keeps its original year. Do not report either as wrong.
        Comments give the non-obvious reason in one line.
        Report comment blocks that restate the code, and prose that belongs in the commit
        message. Report naive datetime use; this project uses timezone-aware values only.
    - path: ".github/workflows/**"
      instructions: >-
        Third-party actions must be pinned to a commit SHA with the version in a trailing
        comment. A job that does not push must set persist-credentials false and declare the
        least permissions it needs.
