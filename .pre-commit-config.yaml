---
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]

  # GitHub Actions security audit. The lint workflow runs this same hook.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  # Python code quality
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Conventional commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # REUSE/SPDX compliance
  - repo: local
    hooks:
      - id: reuse-lint
        name: REUSE Compliance (SPDX headers)
        entry: uv run --no-sync --native-tls python3 -m reuse lint
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy (the type gate CI runs inside format-and-lint)
        entry: uv run --no-sync --native-tls mypy
        language: system
        pass_filenames: false
        files: \.py$

      - id: diagnostic-wording
        name: Diagnostic codes have operator wording
        entry: python3 scripts/check_diagnostic_wording.py
        language: system
        pass_filenames: false
        files: ^netbox_data_import/(target_modules|review_workspace)\.py$

      - id: spec-diagnostics
        name: Normative spec tables list every diagnostic the planner emits
        entry: python3 scripts/check_spec_diagnostics.py
        language: system
        pass_filenames: false
        files: ^(netbox_data_import/(cable_target|models|target_modules|trace_workbook)\.py|docs/spec/target-neutral-import-architecture\.md|scripts/check_spec_diagnostics\.py)$

      - id: gen-compatibility
        name: Compatibility metadata follows the version and the test matrix
        entry: python3 scripts/gen_compatibility.py
        language: system
        pass_filenames: false
        files: ^(netbox_data_import/__init__\.py|\.github/workflows/test\.yaml|scripts/gen_compatibility\.py|netbox-plugin\.yaml|COMPATIBILITY\.md)$

# Configuration
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false
