rules:
  - id: nbdi-tests-use-public-coordinator
    languages: [python]
    severity: ERROR
    message: >-
      Use the public ImportEngine coordinator interface. This reads a private attribute on the
      coordinator or on a value bound from it.
    mode: taint
    pattern-sources:
      - pattern: netbox_data_import.import_engine.ImportEngine
      - pattern: netbox_data_import.import_engine.ImportEngine(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $X.$PRIV
              - pattern: getattr($X, "$PRIV", ...)
          - metavariable-regex:
              metavariable: $PRIV
              regex: '^_'

  - id: nbdi-tests-use-public-coordinator-direct
    languages: [python]
    severity: ERROR
    message: >-
      Use the public ImportEngine coordinator interface. This reads a private attribute off a
      fresh coordinator instance or off the import_engine module itself.
    patterns:
      - pattern-either:
          - pattern: netbox_data_import.import_engine.ImportEngine().$PRIV
          - pattern: netbox_data_import.import_engine.$PRIV
          - pattern: getattr(netbox_data_import.import_engine, "$PRIV", ...)
      - metavariable-regex:
          metavariable: $PRIV
          regex: '^_'

  - id: nbdi-bounded-response-body
    languages: [python]
    severity: ERROR
    message: >-
      Pass a non-None response_body_limit to request_to_resolved_address. An unbounded read lets an
      approved endpoint or a compromised proxy exhaust the NetBox process memory.
    paths:
      exclude:
        - "tests/"
    # response_body_limit is the fifth positional parameter, so both call shapes bound the read.
    # The callee rejects a non-positive limit, so only None is treated as unbounded here.
    pattern-either:
      - patterns:
          - pattern: request_to_resolved_address(...)
          - pattern-not: request_to_resolved_address(..., response_body_limit=$LIMIT, ...)
          - pattern-not: request_to_resolved_address($SESSION, $METHOD, $URL, $ADDRESS, $LIMIT, ...)
      - pattern: request_to_resolved_address(..., response_body_limit=None, ...)
      - pattern: request_to_resolved_address($SESSION, $METHOD, $URL, $ADDRESS, None, ...)
