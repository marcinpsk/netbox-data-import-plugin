rules:
  - id: nbdi-tests-use-public-coordinator
    languages: [python]
    severity: ERROR
    message: >-
      Use the public ImportEngine coordinator interface. This reads a private attribute on the
      coordinator or on a value bound from it.
    mode: taint
    pattern-sources:
      - pattern: netbox_data_import.import_engine.ImportEngine
      - pattern: netbox_data_import.import_engine.ImportEngine(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $X.$PRIV
              - pattern: getattr($X, "$PRIV", ...)
          - metavariable-regex:
              metavariable: $PRIV
              regex: '^_'

  - id: nbdi-tests-use-public-coordinator-direct
    languages: [python]
    severity: ERROR
    message: >-
      Use the public ImportEngine coordinator interface. This reads a private attribute off a
      fresh coordinator instance or off the import_engine module itself.
    patterns:
      - pattern-either:
          - pattern: netbox_data_import.import_engine.ImportEngine().$PRIV
          - pattern: netbox_data_import.import_engine.$PRIV
          - pattern: getattr(netbox_data_import.import_engine, "$PRIV", ...)
      - metavariable-regex:
          metavariable: $PRIV
          regex: '^_'

  - id: nbdi-bounded-response-body
    languages: [python]
    severity: ERROR
    message: >-
      Pass a non-None response_body_limit to request_to_resolved_address. An unbounded read lets an
      approved endpoint or a compromised proxy exhaust the NetBox process memory.
    paths:
      exclude:
        - "tests/"
    # response_body_limit is the fifth positional parameter, so both call shapes bound the read.
    # The callee rejects a non-positive limit, so only None is treated as unbounded here.
    pattern-either:
      - patterns:
          - pattern: request_to_resolved_address(...)
          - pattern-not: request_to_resolved_address(..., response_body_limit=$LIMIT, ...)
          - pattern-not: request_to_resolved_address($SESSION, $METHOD, $URL, $ADDRESS, $LIMIT, ...)
      - pattern: request_to_resolved_address(..., response_body_limit=None, ...)
      - pattern: request_to_resolved_address($SESSION, $METHOD, $URL, $ADDRESS, None, ...)

  - id: nbdi-no-interpreter-stream-patch
    languages: [python]
    severity: ERROR
    message: >-
      Pass the stream to the callee instead of patching `sys`. A replaced `sys.stdin` or `sys.stdout`
      rewires this interpreter; it does not stand in for a boundary the suite cannot run locally.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: patch.object(sys, "$STREAM", ...)
              - pattern: mock.patch.object(sys, "$STREAM", ...)
          - metavariable-regex:
              metavariable: $STREAM
              regex: '^(stdin|stdout|stderr)$'
      # A dotted target is one string, and a bound string metavariable keeps its quotes.
      - patterns:
          - pattern-either:
              - pattern: patch($TARGET, ...)
              - pattern: mock.patch($TARGET, ...)
          - metavariable-regex:
              metavariable: $TARGET
              regex: '^[''"]sys\.(stdin|stdout|stderr)[''"]$'

  - id: nbdi-deadline-alarm-keeps-its-default-action
    languages: [python]
    severity: ERROR
    message: >-
      Leave SIGALRM at its default action. A Python-level handler runs only once the interpreter
      regains control, so a worker blocked in getaddrinfo outlives its deadline (measured 20.04s
      against a 1.00s alarm); the default action terminates it at the alarm.
    # SIG_DFL restores the default action, which is what the rule asks for. SIG_IGN stays refused:
    # an ignored SIGALRM removes the deadline altogether.
    pattern-either:
      - patterns:
          - pattern: signal.signal(signal.SIGALRM, ...)
          - pattern-not: signal.signal(signal.SIGALRM, signal.SIG_DFL)
          - pattern-not: signal.signal(signal.SIGALRM, SIG_DFL)
      - patterns:
          - pattern: signal.signal(SIGALRM, ...)
          - pattern-not: signal.signal(SIGALRM, signal.SIG_DFL)
          - pattern-not: signal.signal(SIGALRM, SIG_DFL)
