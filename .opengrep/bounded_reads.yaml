rules:
  - id: nbdi-bounded-response-body
    languages: [python]
    severity: ERROR
    message: >-
      Pass response_body_limit to request_to_resolved_address. An unbounded read lets an approved
      endpoint or a compromised proxy exhaust the NetBox process memory.
    paths:
      exclude:
        - "tests/"
    patterns:
      - pattern: request_to_resolved_address(...)
      - pattern-not: request_to_resolved_address(..., response_body_limit=$LIMIT, ...)
